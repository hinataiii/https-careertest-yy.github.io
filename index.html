<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="基于多元智能理论的职业天赋测试：自选题量，10 维度天赋图谱 + 人格解读 + 职业方向推荐">
  <title>职业天赋测试 · 找到适合你的职业方向</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <!-- 卡通字体（国内镜像，加载失败时自动回退系统字体） -->
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap">
  <style>
/* ============================================================
   职业天赋测试 - 多巴胺彩色风格
   移动端优先，桌面端居中放大
   ============================================================ */

:root {
  --bg: #FFF7EE;
  --card: #FFFFFF;
  --ink: #3A2E4F;
  --ink-soft: #7A6E8F;
  --grad: linear-gradient(135deg, #FF6B9D 0%, #845EF7 100%);
  --grad2: linear-gradient(135deg, #FFA94D 0%, #FF6B9D 100%);
  --shadow: 0 10px 30px rgba(132, 94, 247, .14);
  --radius: 22px;
  --fun: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --body: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---------- 背景漂浮色块 ---------- */
.bg-blobs {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .5;
  animation: drift 14s ease-in-out infinite alternate;
}

.b1 {
  width: 46vw;
  height: 46vw;
  min-width: 260px;
  min-height: 260px;
  background: #FFB8D9;
  top: -8%;
  left: -10%;
}

.b2 {
  width: 38vw;
  height: 38vw;
  min-width: 220px;
  min-height: 220px;
  background: #C5B3FF;
  top: 22%;
  right: -12%;
  animation-delay: -4s;
}

.b3 {
  width: 34vw;
  height: 34vw;
  min-width: 200px;
  min-height: 200px;
  background: #B3F0E2;
  bottom: 6%;
  left: -8%;
  animation-delay: -8s;
}

.b4 {
  width: 26vw;
  height: 26vw;
  min-width: 150px;
  min-height: 150px;
  background: #FFE3A3;
  bottom: -6%;
  right: 6%;
  animation-delay: -2s;
}

.b5 {
  width: 18vw;
  height: 18vw;
  min-width: 120px;
  min-height: 120px;
  background: #FFC3A3;
  top: 45%;
  left: 30%;
  animation-delay: -6s;
}

@keyframes drift {
  from {
    transform: translate(0, 0) scale(1);
  }

  to {
    transform: translate(4vw, 5vh) scale(1.12);
  }
}

/* ---------- 布局 ---------- */
.container {
  max-width: 660px;
  margin: 0 auto;
  padding: 18px 16px 40px;
}

.screen {
  animation: pop .35s ease both;
}

.hidden {
  display: none !important;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 18px;
  margin-bottom: 16px;
}

.sec-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

.sec-icon {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: #F3EDFF;
  display: grid;
  place-items: center;
  font-size: 17px;
  flex: none;
}

.sec-head h2 {
  font-family: var(--fun);
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
}

.sec-note {
  margin-left: auto;
  font-size: 12px;
  color: var(--ink-soft);
}

/* ---------- 首页 hero ---------- */
.hero {
  text-align: center;
  padding: 26px 10px 20px;
  position: relative;
}

.hero-badge {
  display: inline-block;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 999px;
  background: #FFF0D9;
  color: #B0680C;
  transform: rotate(-2deg);
  margin-bottom: 12px;
  box-shadow: 0 4px 12px rgba(255, 169, 77, .25);
}

.hero-title {
  font-family: var(--fun);
  font-weight: 400;
  font-size: clamp(34px, 9vw, 46px);
  letter-spacing: 4px;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 10px rgba(255, 107, 157, .3));
}

.hero-sub {
  margin-top: 10px;
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.7;
}

.hero-emoji {
  margin-top: 8px;
  height: 30px;
}

.fe {
  display: inline-block;
  font-size: 22px;
  margin: 0 5px;
  animation: bounce 2.4s ease-in-out infinite;
}

.f1 {
  animation-delay: 0s;
}

.f2 {
  animation-delay: -.4s;
}

.f3 {
  animation-delay: -.8s;
}

.f4 {
  animation-delay: -1.2s;
}

.f5 {
  animation-delay: -1.6s;
}

.f6 {
  animation-delay: -2s;
}

@keyframes bounce {

  0%,
  100% {
    transform: translateY(0) rotate(-4deg);
  }

  50% {
    transform: translateY(-7px) rotate(6deg);
  }
}

/* ---------- 维度九宫格 ---------- */
.dim-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.dim-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 15px;
  background: #FBF8FF;
  border: 2px solid transparent;
  font-size: 13px;
  font-weight: 600;
  transition: transform .2s;
}

.dim-chip:nth-child(odd) {
  transform: rotate(-1deg);
}

.dim-chip:nth-child(even) {
  transform: rotate(1deg);
}

.dim-chip .di {
  font-size: 18px;
}

.dim-chip .dl {
  width: 20px;
  height: 20px;
  border-radius: 7px;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex: none;
  margin-left: auto;
}

/* ---------- 版本选择 ---------- */
.version-list {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.ver-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  border-radius: 18px;
  cursor: pointer;
  text-align: left;
  background: #FBF9FF;
  border: 2px solid #EFE9FA;
  transition: all .2s;
  font-family: var(--body);
}

.ver-card .vi {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 22px;
  flex: none;
}

.ver-card .vt {
  flex: 1;
  min-width: 0;
}

.ver-card .vt b {
  font-family: var(--fun);
  font-weight: 400;
  font-size: 17px;
  letter-spacing: 1px;
}

.ver-card .vt .vc {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 3px;
  line-height: 1.5;
}

.ver-card .vt .vc em {
  font-style: normal;
  color: #E8590C;
  font-weight: 700;
  margin-right: 6px;
}

.ver-card .pick {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #D8CFF0;
  flex: none;
  display: grid;
  place-items: center;
  color: transparent;
  font-size: 12px;
  font-weight: 900;
  transition: all .2s;
}

.ver-card.active {
  border-color: #845EF7;
  background: #F6F1FF;
  transform: rotate(-.5deg) scale(1.01);
  box-shadow: 0 8px 20px rgba(132, 94, 247, .18);
}

.ver-card.active .pick {
  background: #845EF7;
  border-color: #845EF7;
  color: #fff;
}

.ver-sticker {
  position: absolute;
  top: -9px;
  right: 12px;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--grad2);
  color: #fff;
  transform: rotate(4deg);
  box-shadow: 0 4px 10px rgba(255, 107, 157, .35);
  letter-spacing: 1px;
}

/* ---------- 按钮 ---------- */
.btn-primary {
  width: 100%;
  border: none;
  cursor: pointer;
  font-family: var(--fun);
  letter-spacing: 3px;
  background: var(--grad);
  color: #fff;
  font-size: 20px;
  padding: 15px;
  border-radius: 999px;
  box-shadow: 0 10px 24px rgba(132, 94, 247, .35);
  transition: transform .15s, box-shadow .15s;
}

.btn-primary:active {
  transform: scale(.96);
  box-shadow: 0 4px 12px rgba(132, 94, 247, .3);
}

.btn-primary.big {
  font-size: 21px;
  padding: 16px;
}

.btn-ghost {
  border: 2px solid #E8E0F7;
  background: #fff;
  color: var(--ink-soft);
  font-size: 14px;
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--body);
  transition: all .2s;
}

.btn-ghost:active {
  transform: scale(.95);
}

.btn-ghost:disabled {
  opacity: .4;
  cursor: default;
}

.link-btn {
  display: inline-block;
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--body);
  color: #845EF7;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 10px;
  text-decoration: underline wavy #D8CFF0 2px;
  text-underline-offset: 4px;
}

.link-btn.hidden {
  display: none;
}

.home-links {
  text-align: center;
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 2px 6px;
}

/* ---------- 首页小特色行 & 页脚 ---------- */
.feat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 8px;
}

.feat {
  background: #fff;
  border-radius: 18px;
  padding: 14px 6px;
  text-align: center;
  box-shadow: var(--shadow);
}

.feat span {
  font-size: 26px;
}

.feat p {
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--ink-soft);
  line-height: 1.5;
}

.feat:nth-child(1) {
  transform: rotate(-1.2deg);
}

.feat:nth-child(3) {
  transform: rotate(1.2deg);
}

.foot {
  text-align: center;
  font-size: 11px;
  color: #B9B0CC;
  line-height: 1.9;
  padding: 14px 0 6px;
}

/* ---------- 答题页 ---------- */
#screen-quiz {
  display: flex;
  flex-direction: column;
  min-height: 82vh;
}

.quiz-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 2px 12px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  border: 2px solid #EFE7FB;
  background: #fff;
  font-size: 16px;
  color: var(--ink-soft);
  cursor: pointer;
  display: grid;
  place-items: center;
  flex: none;
}

.quiz-title {
  font-family: var(--fun);
  font-size: 17px;
  letter-spacing: 2px;
}

.quiz-counter {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
  color: #845EF7;
  background: #F3EDFF;
  padding: 5px 12px;
  border-radius: 999px;
}

.progress-track {
  height: 10px;
  border-radius: 999px;
  background: #F0EAFB;
  overflow: hidden;
  margin-bottom: 22px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: var(--grad);
  transition: width .35s ease;
}

.quiz-body {
  flex: 1;
}

.q-num {
  text-align: center;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.q-card {
  background: #fff;
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 30px 22px;
  text-align: center;
  animation: pop .3s ease both;
}

.q-emoji {
  font-size: 34px;
  display: block;
  margin-bottom: 12px;
}

.q-text {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.75;
}

.opts {
  display: grid;
  gap: 10px;
  margin-top: 24px;
}

.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  cursor: pointer;
  padding: 13px 16px;
  border-radius: 16px;
  border: 2px solid #F0EBFA;
  background: #FDFCFF;
  font-family: var(--body);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  transition: all .18s;
}

.opt .od {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 900;
  flex: none;
}

.opt:active {
  transform: scale(.97);
}

.opt.sel {
  color: #fff;
  transform: scale(1.01);
  box-shadow: 0 8px 18px rgba(132, 94, 247, .28);
}

.opt.sel .od {
  background: rgba(255, 255, 255, .28) !important;
}

.quiz-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  gap: 10px;
}

.quiz-hint {
  font-size: 12px;
  color: #B9B0CC;
  text-align: right;
}

/* ---------- 报告页 ---------- */
.report-head {
  text-align: center;
  padding: 14px 0 6px;
  color: #fff;
  position: relative;
}

.report-head .rh-bg {
  background: var(--grad);
  border-radius: 26px 26px 26px 6px;
  padding: 24px 16px 22px;
  box-shadow: 0 14px 30px rgba(132, 94, 247, .3);
  transform: rotate(-.6deg);
}

.report-head h1 {
  font-family: var(--fun);
  font-weight: 400;
  font-size: 26px;
  letter-spacing: 3px;
}

.report-head .rh-meta {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.rh-tag {
  font-size: 11px;
  padding: 4px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .22);
}

.overview {
  display: flex;
  align-items: center;
  gap: 16px;
}

.overview .chart {
  flex: none;
}

.overview .otext {
  flex: 1;
  min-width: 0;
}

.type-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--fun);
  font-size: 17px;
  letter-spacing: 1px;
  padding: 7px 16px;
  border-radius: 999px;
  color: #fff;
  box-shadow: 0 6px 14px rgba(132, 94, 247, .25);
  transform: rotate(-1.5deg);
}

.overview .summary {
  margin-top: 10px;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--ink);
}

.overview .summary b {
  color: #7048E8;
}

.radar-wrap {
  text-align: center;
}

.radar-wrap svg {
  width: 100%;
  max-width: 400px;
  height: auto;
}

.radar-legend {
  display: flex;
  justify-content: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--ink-soft);
  flex-wrap: wrap;
}

.radar-legend i {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 4px;
}

/* 各项天赋详情 */
.dim-list {
  display: grid;
  gap: 11px;
}

.dim-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.dim-row .dl {
  width: 24px;
  height: 24px;
  border-radius: 9px;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex: none;
}

.dim-row .dn {
  width: 72px;
  font-size: 13px;
  font-weight: 600;
  flex: none;
}

.dim-row .track {
  flex: 1;
  height: 10px;
  background: #F1ECFB;
  border-radius: 999px;
  overflow: hidden;
}

.dim-row .fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  transition: width .8s cubic-bezier(.22, 1, .36, 1);
}

.dim-row .ds {
  width: 30px;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  flex: none;
}

.lv {
  font-size: 10.5px;
  padding: 3px 8px;
  border-radius: 999px;
  flex: none;
  font-weight: 700;
}

.lv-high {
  background: #E6FCF5;
  color: #0CA678;
}

.lv-mid {
  background: #EDF2FF;
  color: #4263EB;
}

.lv-low {
  background: #FFF4E6;
  color: #E8590C;
}

.lv-min {
  background: #F1F3F5;
  color: #868E96;
}

/* 类型解读 */
.type-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.type-big {
  width: 52px;
  height: 52px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 27px;
  flex: none;
  transform: rotate(-3deg);
  box-shadow: 0 8px 16px rgba(0, 0, 0, .08);
}

.type-head b {
  font-family: var(--fun);
  font-weight: 400;
  font-size: 22px;
  letter-spacing: 2px;
}

.type-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 2px 0 12px;
}

.type-tags .tg {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #F6F1FF;
  color: #7048E8;
  font-weight: 600;
}

.block-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 14.5px;
  margin: 16px 0 8px;
}

.block-soft {
  background: #F8F6FE;
  border-radius: 15px;
  padding: 12px 14px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink);
}

.block-warn {
  background: #FFFBEA;
}

.similar {
  display: flex;
  gap: 12px;
  margin-top: 14px;
  background: #F4FBFF;
  border-radius: 15px;
  padding: 12px 14px;
}

.similar .sim-tag {
  flex: none;
  font-size: 11px;
  color: #1C7ED6;
  background: #D0EBFF;
  border-radius: 999px;
  padding: 4px 9px;
  height: fit-content;
  font-weight: 700;
}

.similar .sim-name {
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 4px;
}

.similar .sim-story {
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.8;
}

/* 优势深度解读 */
.adv-card {
  display: flex;
  gap: 13px;
  padding: 13px 0;
  border-bottom: 1.5px dashed #EFE9FA;
}

.adv-card:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.adv-card:first-child {
  padding-top: 2px;
}

.adv-ico {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 23px;
  flex: none;
  transform: rotate(-2deg);
}

.adv-main {
  flex: 1;
  min-width: 0;
}

.adv-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.adv-name-row b {
  font-size: 15.5px;
}

.adv-name-row .as {
  font-size: 11.5px;
  color: var(--ink-soft);
  font-weight: 600;
}

.adv-track {
  height: 9px;
  background: #F1ECFB;
  border-radius: 999px;
  overflow: hidden;
  margin: 8px 0;
}

.adv-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
}

.adv-detail {
  font-size: 13px;
  line-height: 1.8;
  color: var(--ink);
}

.adv-tips {
  margin-top: 8px;
  display: grid;
  gap: 5px;
}

.adv-tips li {
  list-style: none;
  font-size: 12.5px;
  color: var(--ink-soft);
  display: flex;
  gap: 6px;
  line-height: 1.7;
}

  /* ---------------- 通用工具 ---------------- */

  function show(screenId) {
    ['screen-home', 'screen-quiz', 'screen-result'].forEach(function (id) {
      $('#' + id).classList.toggle('hidden', id !== screenId);
    });
    window.scrollTo(0, 0);
  }

  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function levelOf(pct) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (pct >= LEVELS[i].min) return LEVELS[i];
    }
    return LEVELS[LEVELS.length - 1];
  }

  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) { } }

  /* ---------------- 首页 ---------------- */

  function renderHome() {
    // 10 维度预览

        '<span class="pick">✓</span></button>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.ver-card'), function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(document.querySelectorAll('.ver-card'), function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });

    // 上次进度 / 上次报告
    var prog = load(KEY_PROGRESS);
    var res = load(KEY_RESULT);
    var btnCont = $('#btn-continue');
    if (prog && prog.idx > 0 && prog.idx < prog.order.length) {
      btnCont.textContent = '⏸️ 继续上次测试（已完成 ' + prog.idx + '/' + prog.order.length + ' 题）';
      btnCont.classList.remove('hidden');
    } else {
      btnCont.classList.add('hidden');
    }
    $('#btn-last').classList.toggle('hidden', !res);

    show('screen-home');
  }

  /* ---------------- 答题流程 ---------------- */

  function startTest(verId) {
    var ver = VERSIONS.filter(function (v) { return v.id === verId; })[0] || VERSIONS[1];
    // 按维度轮询交错出题，避免同维度连续出现
    var byDim = {};
    QUESTIONS.forEach(function (q, i) { (byDim[q.dim] = byDim[q.dim] || []).push(i); });
    var order = [];
    for (var r = 0; r < ver.per; r++) {
      DIMS.forEach(function (d) { order.push(byDim[d.key][r]); });
    }
    cur = { ver: ver, order: order, answers: new Array(order.length).fill(null), idx: 0 };
    show('screen-quiz');
    renderQuestion();
  }

  function renderQuestion() {
    var qi = cur.order[cur.idx];
    var q = QUESTIONS[qi];
    $('#quiz-counter').textContent = (cur.idx + 1) + '/' + cur.order.length;
    $('#progress-fill').style.width = (cur.idx / cur.order.length * 100) + '%';
    $('#btn-prev').disabled = cur.idx === 0;

    var last = cur.idx === cur.order.length - 1;
    $('#quiz-body').innerHTML =
      '<div class="q-num">' + (last ? '最后一题' : '还剩 ' + (cur.order.length - cur.idx - 1) + ' 题') + '</div>' +
      '<div class="q-card"><span class="q-emoji">' + ['💭', '🎯', '🌈', '⚡', '🍀', '🔍'][cur.idx % 6] + '</span>' +
      '<p class="q-text">' + q.text + '</p>' +
      '<div class="opts">' + OPTS.map(function (o) {
        return '<button class="opt" data-s="' + o.s + '"><span class="od" style="background:' + o.c + '">' + o.s + '</span>' + o.label + '</button>';
      }).join('') + '</div></div>';

    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (btn) {
      btn.addEventListener('click', function () {
        // 防止连点重复提交
        if (btn.classList.contains('sel')) return;
        Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { b.classList.remove('sel'); });
        btn.classList.add('sel');
        cur.answers[cur.idx] = Number(btn.getAttribute('data-s'));
        saveProgress();
        setTimeout(function () {
          if (cur.idx < cur.order.length - 1) {
            cur.idx++;
            renderQuestion();
          } else {
            finishTest();
          }
        }, 240);
      });
    });
  }

  function saveProgress() {
    save(KEY_PROGRESS, { verId: cur.ver.id, order: cur.order, answers: cur.answers, idx: cur.idx });
  }

  /* ---------------- 计算报告 ---------------- */

  function computeResult(ver, answers, order) {
    var sums = {}, counts = {};
    order.forEach(function (qi, i) {
      var d = QUESTIONS[qi].dim;
      sums[d] = (sums[d] || 0) + (answers[i] || 0);
      counts[d] = (counts[d] || 0) + 1;
    });
    var dims = DIMS.map(function (dm) {
      var s = sums[dm.key], c = counts[dm.key];
      var pct = Math.max(0, Math.min(100, Math.round(((s / c) - 1) / 4 * 100)));
      return { key: dm.key, name: dm.name, icon: dm.icon, color: dm.color, score: s, max: c * 5, pct: pct };
    });
    var sorted = dims.slice().sort(function (a, b) { return b.pct - a.pct || dims.indexOf(a) - dims.indexOf(b); });
    var top2 = sorted.slice(0, 2).map(function (d) { return d.key; });
    var top3 = sorted.slice(0, 3).map(function (d) { return d.key; });
    var type = TYPES.filter(function (t) { return t.rule(top2, top3); })[0] || TYPES[TYPES.length - 1];
    var overall = Math.round(dims.reduce(function (a, d) { return a + d.pct; }, 0) / dims.length);

    var careers = CAREERS.map(function (c) {
      var wSum = 0, vSum = 0;
      Object.keys(c.dims).forEach(function (k) {
        wSum += c.dims[k];
        var dim = dims.filter(function (d) { return d.key === k; })[0];
        vSum += c.dims[k] * dim.pct;
      });
      return { name: c.name, icon: c.icon, desc: c.desc, tip: c.tip, match: Math.round(vSum / wSum), dims: c.dims };
    }).sort(function (a, b) { return b.match - a.match; }).slice(0, 6);

    return {
      verId: ver.id, verName: ver.name, date: new Date().toLocaleDateString('zh-CN'),
      dims: dims, sorted: sorted, type: type.id, overall: overall, careers: careers
    };
  }

  function finishTest() {
    var result = computeResult(cur.ver, cur.answers, cur.order);
    del(KEY_PROGRESS);
    save(KEY_RESULT, result);
    renderResult(result, false);
  }

  /* ---------------- SVG 图形 ---------------- */

  // 综合得分圆环
  function circleSVG(pct) {
    var r = 58, C = (2 * Math.PI * r).toFixed(1);
    return '<svg viewBox="0 0 150 150" width="140" height="140">' +
      '<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#FF6B9D"/><stop offset="1" stop-color="#845EF7"/></linearGradient></defs>' +
      '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="#F1ECFB" stroke-width="14"/>' +
      '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="url(#cg)" stroke-width="14" stroke-linecap="round"' +
      ' stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" transform="rotate(-90 75 75)" class="ring"/>' +
      '<text x="75" y="72" text-anchor="middle" font-size="34" font-weight="800" fill="#7048E8" font-family="inherit">' + pct + '</text>' +
      '<text x="75" y="94" text-anchor="middle" font-size="13" fill="#9A8FB5">天赋指数%</text>' +
      '</svg>';
  }

  // 10 维度雷达图
  function radarSVG(dims) {
    var N = dims.length, cx = 165, cy = 148, R = 92;
    function pt(i, r) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / N;
      return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
    }
    var svg = '<svg viewBox="0 0 330 296">';
    // 网格环
    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      var pts = [];
      for (var i = 0; i < N; i++) { var p = pt(i, R * f); pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
      svg += '<polygon points="' + pts.join(' ') + '" fill="' + (f === 1 ? '#FAF7FF' : 'none') + '" stroke="#E8E0F6" stroke-width="1"/>';
    });
    // 轴线 + 标签
    for (var i = 0; i < N; i++) {
      var p = pt(i, R), lp = pt(i, R + 22);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#E8E0F6" stroke-width="1"/>';
      var cosV = Math.cos(-Math.PI / 2 + i * 2 * Math.PI / N), sinV = Math.sin(-Math.PI / 2 + i * 2 * Math.PI / N);
      var anchor = cosV > 0.3 ? 'start' : (cosV < -0.3 ? 'end' : 'middle');
      var dy = sinV < -0.3 ? -3 : (sinV > 0.3 ? 10 : 4);
      svg += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + dy).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="12" font-weight="700" fill="#8A7FA5">' + dims[i].key + '(' + dims[i].score + '分)</text>';
    }
    // 数据多边形
    var dpts = [];
    for (var j = 0; j < N; j++) {
      var q = pt(j, R * dims[j].pct / 100);
      dpts.push(q[0].toFixed(1) + ',' + q[1].toFixed(1));
    }
    svg += '<polygon points="' + dpts.join(' ') + '" fill="rgba(132,94,247,.22)" stroke="#845EF7" stroke-width="2.5" stroke-linejoin="round"/>';
    for (var k = 0; k < N; k++) {
      var w = pt(k, R * dims[k].pct / 100);
      svg += '<circle cx="' + w[0].toFixed(1) + '" cy="' + w[1].toFixed(1) + '" r="3.4" fill="#845EF7" stroke="#fff" stroke-width="1.5"/>';
    }
    svg += '</svg>';
    return svg;
  }

  /* ---------------- 报告渲染 ---------------- */

  function dimTag(k) {
    var d = DIMS.filter(function (x) { return x.key === k; })[0];
    return '<span class="cd" style="background:' + d.color + '">' + d.icon + ' ' + d.name + '</span>';
  }

  function renderResult(r, isStored) {
    var dims = r.dims, sorted = r.sorted;
    var type = TYPES.filter(function (t) { return t.id === r.type; })[0];
    var top = sorted.slice(0, 3), bottom = sorted.slice(-2).reverse();
    var t1 = top[0], t2 = top[1], t3 = top[2];

    // --- 概览卡 ---
    var html =
      '<header class="report-head"><div class="rh-bg">' +
      '<h1>天赋能力测试报告</h1>' +
      '<div class="rh-meta"><span class="rh-tag">🌈 ' + r.verName + '</span><span class="rh-tag">基于多元智能理论</span><span class="rh-tag">' + r.date + '</span></div>' +
      '</div></header>' +

      '<div class="card"><div class="overview">' +
      '<div class="chart">' + circleSVG(r.overall) + '</div>' +
      '<div class="otext">' +
      '<span class="type-pill" style="background:' + type.color + '">' + type.icon + ' ' + type.name + '</span>' +
      '<p class="summary">你最具 <b>「' + t1.name + '」「' + t2.name + '」「' + t3.name + '」</b> 天赋，' +
      '而 <b>「' + bottom[1].name + '」「' + bottom[0].name + '」</b> 相对较弱。</p>' +
      '</div></div></div>' +

      // --- 雷达图 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">📊</span><h2>天赋能力图谱</h2><span class="sec-note">' + dims.length + '维度全景展示</span></div>' +
      '<div class="radar-wrap">' + radarSVG(dims) +
      '<div class="radar-legend"><span><i style="background:#845EF7"></i>80%+ 非常擅长</span><span><i style="background:#4DABF7"></i>60-79% 有些擅长</span><span><i style="background:#CED4DA"></i>&lt;60% 待发展</span></div>' +
      '</div></div>' +

      // --- 各项天赋详情 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">📋</span><h2>各项天赋详情</h2><span class="sec-note">满分 ' + dims[0].max + ' 分</span></div><div class="dim-list">' +
      sorted.map(function (d) {
        var lv = levelOf(d.pct);
        return '<div class="dim-row"><span class="dl" style="background:' + d.color + '">' + d.key + '</span>' +
          '<span class="dn">' + d.name + '</span>' +
          '<span class="track"><span class="fill" style="width:' + d.pct + '%;background:linear-gradient(90deg,' + d.color + '88,' + d.color + ')"></span></span>' +
          '<span class="ds">' + d.score + '</span>' +
          '<span class="lv ' + lv.cls + '">' + lv.label + '</span></div>';
      }).join('') + '</div></div>' +

      // --- 天赋类型解读 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">🎯</span><h2>天赋类型解读</h2></div>' +
      '<div class="type-head"><span class="type-big" style="background:' + type.color + '22">' + type.icon + '</span><b style="color:' + type.color + '">' + type.name + '</b></div>' +
      '<div class="type-tags">' + top.map(function (d) { return '<span class="tg">' + d.icon + ' ' + d.name + '</span>'; }).join('') + '</div>' +
      '<p style="font-size:14px;line-height:1.8">' + type.desc + '</p>' +
      '<div class="block-title">💪 核心优势组合</div><div class="block-soft">' + type.strength + '</div>' +
      '<div class="block-title">⚡ 潜在挑战</div><div class="block-soft block-warn">' + type.challenge + '</div>' +
      '<div class="similar"><span class="sim-tag">与你相似的人</span><div><div class="sim-name">' + type.similar.name + '</div>' +
      '<div class="sim-story">' + type.similar.story + '</div></div></div></div>' +

      // --- 核心优势深度解读 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">👑</span><h2>核心优势深度解读</h2><span class="sec-note">你的前三天赋</span></div>' +
      top.map(function (d) {
        var m = DIM_META[d.key], lv = levelOf(d.pct);
        return '<div class="adv-card">' +
          '<span class="adv-ico" style="background:' + d.color + '22">' + d.icon + '</span>' +
          '<div class="adv-main"><div class="adv-name-row"><b>' + d.name + '天赋</b>' +
          '<span class="as">' + d.score + '/' + d.max + ' · ' + lv.label + '</span>' +
          '<span class="lv ' + lv.cls + '">' + d.pct + '%</span></div>' +
          '<div class="adv-track"><div class="adv-fill" style="width:' + d.pct + '%;background:' + d.color + '"></div></div>' +
          '<p class="adv-detail">' + m.detail + '</p>' +
          '<div class="block-title" style="margin:10px 0 6px">💡 发挥建议</div>' +
          '<ul class="adv-tips">' + m.advice.map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ul>' +
          '</div></div>';
      }).join('') + '</div>' +

      // --- 成长空间 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">🌱</span><h2>成长空间</h2><span class="sec-note">潜力提升方向</span></div>' +
      bottom.map(function (d) {
        var m = DIM_META[d.key];
        return '<div class="grow-item"><div class="grow-head">' + d.icon + ' <b>' + d.name + '</b>' +
          '<span class="lv ' + levelOf(d.pct).cls + '">' + d.score + '分 · ' + levelOf(d.pct).label + '</span></div>' +
          '<p class="grow-text">' + m.growth + '</p>' +
          '<p class="grow-tip">' + m.tip + '</p></div>';
      }).join('') + '</div>' +

      // --- 职业推荐 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">💼</span><h2>职业发展指南</h2><span class="sec-note">基于天赋的匹配</span></div>' +
      '<div class="block-title" style="margin-top:0">🧭 推荐职业方向 <i style="font-style:normal;font-size:12px;color:var(--ink-soft)">取前 6 个</i></div>' +
      r.careers.map(function (c, i) {
        return '<div class="career-card"><span class="career-rank">' + (i + 1) + '</span>' +
          '<div class="career-name-row"><b>' + c.icon + ' ' + c.name + '</b>' +
          '<span class="career-match"><span class="track"><span class="fill" style="width:' + c.match + '%"></span></span><span class="pct">' + c.match + '%</span></span></div>' +
          '<div class="career-dims">' + Object.keys(c.dims).map(dimTag).join('') + '</div>' +
          '<p class="career-desc">' + c.desc + '</p>' +
          '<p class="career-tip">🚀 ' + c.tip + '</p></div>';
      }).join('') + '</div>' +

      // --- 行动计划 ---
      '<div class="card"><div class="sec-head"><span class="sec-icon">📅</span><h2>行动计划</h2><span class="sec-note">分阶段成长路径</span></div>' +
      '<p class="plan-intro">下面是一份可以直接照着执行的行动清单，帮你把「看到报告」变成「真正发生改变」。可以先从短期目标里挑 1-2 条开始。</p>' +
      '<div class="plan-box pb-short"><div class="pb-head">🎯 <b>短期目标</b><i>1-3 个月</i></div><ul>' +
      [DIM_META[t1.key].plan.short, DIM_META[t2.key].plan.short, DIM_META[bottom[0].key].tip.replace('提升建议：', '')].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>' +
      '<div class="plan-box pb-mid"><div class="pb-head">📈 <b>中期发展</b><i>6-12 个月</i></div><ul>' +
      [DIM_META[t1.key].plan.mid, DIM_META[t2.key].plan.mid, '每月复盘一次：记录自己的成长与困惑'].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>' +
      '<div class="plan-box pb-long"><div class="pb-head">🌅 <b>长期愿景</b><i>持续思考</i></div><ul>' +
      [DIM_META[t1.key].plan.long, type.vision, '把天赋组合成别人拿不走的核心竞争力'].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div></div>' +

      // --- 底部操作 ---
      '<div class="result-actions">' +
      '<button id="btn-copy" class="btn-outline">📋 复制报告摘要</button>' +
      '<button id="btn-restart" class="btn-primary big">🔄 再测一次</button>' +
      '</div>' +
      '<p class="result-note">长按/截图即可保存这份报告 · 测试仅供职业探索参考<br>天赋没有高低，只有不同的组合方式 ✨</p>';

    $('#screen-result').innerHTML = html;
    show('screen-result');

    // 圆环动画
    var ring = document.querySelector('.ring');
    if (ring) {
      var C = Number(ring.getAttribute('stroke-dasharray'));
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          ring.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)';
          ring.setAttribute('stroke-dashoffset', (C * (1 - r.overall / 100)).toFixed(1));
        });
      });
    }

    $('#btn-restart').addEventListener('click', function () { renderHome(); });
    $('#btn-copy').addEventListener('click', function () {
      var txt = '【职业天赋测试报告】\n天赋指数：' + r.overall + '%\n人格类型：' + type.icon + type.name +
        '\n核心天赋：' + top.map(function (d) { return d.name; }).join('、') +
        '\n推荐职业：' + r.careers.slice(0, 3).map(function (c) { return c.name + '(' + c.match + '%)'; }).join('、') +
        '\n——来自「职业天赋测试」';
      copyText(txt);
    });
  }

  function copyText(txt) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('✅ 已复制到剪贴板'); } catch (e) { toast('复制失败，请手动截图'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('✅ 已复制到剪贴板'); }, fallback);
    } else { fallback(); }
  }

  /* ---------------- 示例报告（演示模式） ---------------- */

  function showDemo() {
    var ver = VERSIONS[1]; // 标准版
    var DEMO_PCT = { A: 70, B: 90, C: 85, D: 80, E: 60, F: 75, G: 70, H: 35, I: 60, J: 65 };
    var byDim = {};
    QUESTIONS.forEach(function (q, i) { (byDim[q.dim] = byDim[q.dim] || []).push(i); });
    var order = [], answers = [];
    for (var r = 0; r < ver.per; r++) {
      DIMS.forEach(function (d) { order.push(byDim[d.key][r]); });
    }
    order.forEach(function (qi, i) {
      var p = DEMO_PCT[QUESTIONS[qi].dim];
      var s = Math.max(1, Math.min(5, Math.ceil(p / 20)));
      if (i % 2 === 1 && p < 85) s = Math.max(1, s - 1);
      answers.push(s);
    });
    var result = computeResult(ver, answers, order);
    renderResult(result, true);
    toast('👀 这是示例报告，数据为演示用');
  }

  /* ---------------- 事件绑定 & 初始化 ---------------- */

  function bind() {
    // 版本卡片选中后，开始按钮取当前选中项
    $('#btn-start').addEventListener('click', function () {
      var active = document.querySelector('.ver-card.active');
      startTest(active ? active.getAttribute('data-v') : 'standard');
    });
    $('#btn-continue').addEventListener('click', function () {
      var prog = load(KEY_PROGRESS);
      if (!prog) return;
      cur = {
        ver: VERSIONS.filter(function (v) { return v.id === prog.verId; })[0] || VERSIONS[1],
        order: prog.order, answers: prog.answers, idx: prog.idx
      };
      show('screen-quiz');
      renderQuestion();
    });
    $('#btn-last').addEventListener('click', function () {
      var r = load(KEY_RESULT);
      if (r) renderResult(r, true);
    });
    $('#btn-demo').addEventListener('click', showDemo);
    $('#btn-exit').addEventListener('click', function () {
      if (confirm('退出测试？已答题目会保存，下次可以继续哦～')) {
        saveProgress();
        renderHome();
      }
    });
    $('#btn-prev').addEventListener('click', function () {
      if (cur.idx > 0) { cur.idx--; renderQuestion(); }
    });
  }

  function init() {
    bind();
    // URL 带 ?demo=1 直接看示例报告
    if (location.search.indexOf('demo=1') > -1) { showDemo(); return; }
    renderHome();
  }

  init();
})();

</script>
